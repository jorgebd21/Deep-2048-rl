<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#00B8D9" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Pill -->
  <rect x="5" y="5" width="790" height="190" rx="24" fill="#090D16" stroke="url(#glowGrad)" stroke-width="2" />

  <!-- 4x4 Mini Abstract Grid Symbol -->
  <g transform="translate(45, 30)">
    <!-- 4x4 grid cells -->
    <!-- Row 0 -->
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="36" y="0" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="72" y="0" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="108" y="0" width="30" height="30" rx="6" fill="url(#gradBrand)" filter="url(#glow)"/>
    <text x="123" y="20" fill="#090D16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" text-anchor="middle">2048</text>

    <!-- Row 1 -->
    <rect x="0" y="36" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="36" y="36" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="72" y="36" width="30" height="30" rx="6" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="108" y="36" width="30" height="30" rx="6" fill="#818CF8" fill-opacity="0.4" stroke="#818CF8" stroke-width="1.5"/>

    <!-- Row 2 -->
    <rect x="0" y="72" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="36" y="72" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="72" y="72" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="108" y="72" width="30" height="30" rx="6" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Row 3 -->
    <rect x="0" y="108" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="36" y="108" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="72" y="108" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="108" y="108" width="30" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <!-- Synaptic Connection Beam -->
    <path d="M 123 30 L 123 51 L 87 51" stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#glow)"/>
    <circle cx="87" cy="51" r="3.5" fill="#00FFA3" />
    <circle cx="123" cy="30" r="3.5" fill="#00FFA3" />
  </g>

  <!-- Typography Brand Header -->
  <g transform="translate(225, 82)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" fill="#FFFFFF">
      DEEP<tspan fill="url(#gradBrand)">-2048-</tspan>RL
    </text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="15" letter-spacing="3" fill="#94A3B8" text-transform="uppercase">
      Autonomous Deep RL &amp; SOTA N-Tuple Hybrid Engine
    </text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-weight="400" font-size="12.5" fill="#38BDF8">
      TF32 Ampere Accelerated &bull; Bitboard 485k moves/s &bull; Sub-Microsecond Leaf Eval
    </text>
  </g>
</svg>
